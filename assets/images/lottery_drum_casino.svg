<svg viewBox="-130 -130 260 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- ネイビー面 -->
    <radialGradient id="casinoFace" cx="36%" cy="28%" r="74%">
      <stop offset="0%" stop-color="#2A3A5A"/>
      <stop offset="45%" stop-color="#141E36"/>
      <stop offset="100%" stop-color="#060810"/>
    </radialGradient>
    <!-- ゴールドリム -->
    <linearGradient id="casinoRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#FFF0A0"/>
      <stop offset="28%"  stop-color="#D4A020"/>
      <stop offset="55%"  stop-color="#FFD700"/>
      <stop offset="78%"  stop-color="#A07010"/>
      <stop offset="100%" stop-color="#FFE566"/>
    </linearGradient>
    <!-- 中央ハブ -->
    <radialGradient id="casinoHub" cx="35%" cy="30%" r="65%">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="40%"  stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#8B6000"/>
    </radialGradient>
    <!-- ハイライト -->
    <radialGradient id="casinoHigh" cx="30%" cy="22%" r="55%">
      <stop offset="0%"   stop-color="white" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 影 -->
  <polygon points="0,-106 75,-75 106,0 75,75 0,106 -75,75 -106,0 -75,-75"
    fill="#000000" opacity="0.35" transform="translate(5,7)"/>

  <!-- ゴールドリム（外枠） -->
  <polygon points="0,-106 75,-75 106,0 75,75 0,106 -75,75 -106,0 -75,-75"
    fill="url(#casinoRim)" stroke="#7A5000" stroke-width="2"/>

  <!-- ネイビー面 -->
  <polygon points="0,-88 62,-62 88,0 62,62 0,88 -62,62 -88,0 -62,-62"
    fill="url(#casinoFace)"/>

  <!-- 放射状ライン（青系） -->
  <line x1="0"   y1="-88" x2="0"   y2="88"  stroke="#3050A0" stroke-width="1.5" opacity="0.7"/>
  <line x1="-88" y1="0"   x2="88"  y2="0"   stroke="#3050A0" stroke-width="1.5" opacity="0.7"/>
  <line x1="-62" y1="-62" x2="62"  y2="62"  stroke="#3050A0" stroke-width="1.5" opacity="0.7"/>
  <line x1="62"  y1="-62" x2="-62" y2="62"  stroke="#3050A0" stroke-width="1.5" opacity="0.7"/>

  <!-- 8方向のゴールドダイヤ -->
  <polygon points="0,-76  5,-70  0,-64  -5,-70"  fill="#FFD700" opacity="0.95"/>
  <polygon points="54,-54  59,-48  54,-42  49,-48" fill="#FFD700" opacity="0.95"/>
  <polygon points="76,0    81,6   76,12   71,6"   fill="#FFD700" opacity="0.95"/>
  <polygon points="54,54   59,60  54,66   49,60"  fill="#FFD700" opacity="0.95"/>
  <polygon points="0,76    5,82   0,88    -5,82"  fill="#FFD700" opacity="0.95"/>
  <polygon points="-54,54  -49,60 -54,66  -59,60" fill="#FFD700" opacity="0.95"/>
  <polygon points="-76,0   -71,6  -76,12  -81,6"  fill="#FFD700" opacity="0.95"/>
  <polygon points="-54,-54 -49,-48 -54,-42 -59,-48" fill="#FFD700" opacity="0.95"/>

  <!-- 中央ゴールドハブ -->
  <circle cx="0" cy="0" r="22" fill="url(#casinoRim)" stroke="#7A5000" stroke-width="2"/>
  <circle cx="0" cy="0" r="14" fill="url(#casinoHub)"/>
  <circle cx="-4" cy="-4" r="4" fill="white" opacity="0.45"/>

  <!-- ハイライト -->
  <polygon points="0,-88 62,-62 88,0 62,62 0,88 -62,62 -88,0 -62,-62"
    fill="url(#casinoHigh)"/>
</svg>
