<svg xmlns="http://www.w3.org/2000/svg" viewBox="-130 -130 260 260">
  <defs>
    <linearGradient id="woodFace" x1="-50%" y1="-50%" x2="50%" y2="50%">
      <stop offset="0%"   stop-color="#E8C87A"/>
      <stop offset="30%"  stop-color="#D4A84B"/>
      <stop offset="60%"  stop-color="#C49B3C"/>
      <stop offset="100%" stop-color="#B8892E"/>
    </linearGradient>
    <radialGradient id="metalHub" cx="35%" cy="30%" r="65%">
      <stop offset="0%"   stop-color="#E0E0E0"/>
      <stop offset="60%"  stop-color="#9E9E9E"/>
      <stop offset="100%" stop-color="#616161"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="3" dy="5" stdDeviation="6" flood-color="#00000044"/>
    </filter>
    <pattern id="grain" patternUnits="userSpaceOnUse" width="40" height="300" patternTransform="rotate(-20)">
      <line x1="8"  y1="-130" x2="8"  y2="130" stroke="#C08B30" stroke-width="0.5" opacity="0.4"/>
      <line x1="20" y1="-130" x2="20" y2="130" stroke="#C08B30" stroke-width="0.3" opacity="0.25"/>
      <line x1="32" y1="-130" x2="32" y2="130" stroke="#C08B30" stroke-width="0.5" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- 八角形本体（外接円半径106） -->
  <polygon
    points="0,-106 75,-75 106,0 75,75 0,106 -75,75 -106,0 -75,-75"
    fill="url(#woodFace)"
    filter="url(#shadow)"
  />
  <polygon
    points="0,-106 75,-75 106,0 75,75 0,106 -75,75 -106,0 -75,-75"
    fill="url(#grain)"
    opacity="0.35"
  />
  <polygon
    points="0,-106 75,-75 106,0 75,75 0,106 -75,75 -106,0 -75,-75"
    fill="none"
    stroke="#8B6914"
    stroke-width="3"
  />

  <!-- 装飾線 -->
  <line x1="-106" y1="0"    x2="106"  y2="0"    stroke="#B8892E" stroke-width="1.5" opacity="0.5"/>
  <line x1="0"    y1="-106" x2="0"    y2="106"  stroke="#B8892E" stroke-width="1.5" opacity="0.3"/>
  <line x1="-75"  y1="-75"  x2="75"   y2="75"   stroke="#B8892E" stroke-width="1"   opacity="0.3"/>
  <line x1="75"   y1="-75"  x2="-75"  y2="75"   stroke="#B8892E" stroke-width="1"   opacity="0.3"/>

  <!-- 中央ボルトのみ（文字なし） -->
  <circle cx="0" cy="0" r="22" fill="#9E9E9E"/>
  <circle cx="0" cy="0" r="18" fill="url(#metalHub)"/>
  <circle cx="0" cy="0" r="8"  fill="#BDBDBD" stroke="#757575" stroke-width="1"/>
  <circle cx="0" cy="0" r="4"  fill="#9E9E9E"/>

  <!-- ハイライト -->
  <ellipse cx="-28" cy="-35" rx="28" ry="16" fill="white" opacity="0.12" transform="rotate(-20,-28,-35)"/>
</svg>
